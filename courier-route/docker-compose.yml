# מסלול שליח - כל השירותים. הפעלה: docker compose up -d --build
services:
  # שרת HTTPS של האפליקציה. פועל רק כשפורטים 80/443 פנויים (COMPOSE_PROFILES=standalone).
  # בשרת שכבר יש בו nginx / CloudPanel, nginx הקיים מעביר את הבקשות ל-API.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      OSRM_URL: http://osrm:5000
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8000"  # נגיש רק מתוך השרת
    volumes:
      - ./data:/data
    depends_on:
      - osrm

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: >
      osrm-routed --algorithm mld
      --max-table-size 1000 --max-viaroute-size 1000
      /data/israel.osrm
    volumes:
      - ./osrm-data:/data:ro

volumes:
  caddy_data:
  caddy_config:
